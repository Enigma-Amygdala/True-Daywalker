name: Temporary 0.4.6 compatibility build

on:
  pull_request:
    branches: [main]

jobs:
  build-compat-046:
    if: github.head_ref == 'compat-0.4.6-ci'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble source bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.ci\td046\part*.b64' | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($b64)
          $zip = Join-Path $env:RUNNER_TEMP 'td046-minbuild.zip'
          [IO.File]::WriteAllBytes($zip, $bytes)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '86be80d9771b5045d42a2619fa59b6a5f1f8805294671f5eff64fe6d6e5e210e') {
            throw "Source bundle SHA-256 mismatch: $hash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath '.ci\td046\src' -Force
          $cmakeDir = '.ci\td046\src\tools\minhook\cmake'
          New-Item -ItemType Directory -Path $cmakeDir -Force | Out-Null
          @'
          set(MINHOOK_MAJOR_VERSION "@MINHOOK_MAJOR_VERSION@")
          set(MINHOOK_MINOR_VERSION "@MINHOOK_MINOR_VERSION@")
          set(MINHOOK_PATCH_VERSION "@MINHOOK_PATCH_VERSION@")
          set(MINHOOK_VERSION "@MINHOOK_VERSION@")
          @PACKAGE_INIT@
          set(MINHOOK_FOUND ON)
          set_and_check(MINHOOK_INCLUDE_DIRS "${PACKAGE_PREFIX_DIR}/include/")
          set_and_check(MINHOOK_LIBRARY_DIRS "${PACKAGE_PREFIX_DIR}/lib")
          include("${PACKAGE_PREFIX_DIR}/share/minhook/minhook-targets.cmake")
          '@ | Set-Content (Join-Path $cmakeDir 'minhook-config.cmake.in') -Encoding ASCII

      - name: Build and run policy tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\.ci\td046\src\Build.ps1' -Configuration Release

      - name: Verify candidate metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = '.\.ci\td046\src\build\Release\version.dll'
          if (!(Test-Path -LiteralPath $dll)) { throw 'version.dll was not produced.' }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($dll))
          if ($ascii -notmatch '0\.4\.6 compatibility candidate') {
            throw '0.4.6 version marker not found in version.dll.'
          }

      - name: Package minimal player candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '.\.ci\td046\package'
          $win64 = Join-Path $root 'Dawnwalker\Binaries\Win64'
          $cfg = Join-Path $win64 'TrueDaywalker'
          New-Item -ItemType Directory -Path $cfg -Force | Out-Null
          Copy-Item '.\.ci\td046\src\build\Release\version.dll' (Join-Path $win64 'version.dll')
          Copy-Item '.\.ci\td046\src\native\TrueDaywalker.ini' (Join-Path $cfg 'TrueDaywalker.ini')
          $out = '.\.ci\td046\TrueDaywalker-0.4.6-Compatibility-Candidate.zip'
          Compress-Archive -Path (Join-Path $root 'Dawnwalker') -DestinationPath $out -CompressionLevel Optimal -Force
          $dllHash = (Get-FileHash (Join-Path $win64 'version.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "version.dll SHA-256: $dllHash"
            "candidate ZIP SHA-256: $zipHash"
          ) | Set-Content '.\.ci\td046\BUILD-INFO.txt' -Encoding ASCII

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: TrueDaywalker-0.4.6-Compatibility-Candidate
          path: |
            .ci/td046/TrueDaywalker-0.4.6-Compatibility-Candidate.zip
            .ci/td046/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7
