[TrueDaywalker]
; 0 disables the mod. Restart the game after changing settings.
Enabled=1
; 0 keeps True Daywalker active even when a save or script selects human form.
; 1 lets every forced-human selection suspend the mod, including saved policies.
RespectForcedHuman=0
; Permit both human and vampire consumables when their other requirements pass.
UnionConsumables=1
; Vampire = vampire appearance day and night. Natural = native day/night appearance.
; Both choices retain the same human and vampire abilities.
Appearance=Vampire
; Human ointments, food and regeneration also restore the active blood pool.
UnionHealing=1
; Record initialization, form transitions, ability checks and feeding entry.
Diagnostics=0
